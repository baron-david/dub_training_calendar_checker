name: Check DubTraining Appointment Availability

on:
  schedule:
    # Runs 4x/day at 2:00, 12:00, 17:00, 21:00 UTC
    ### - cron: '0 2,12,17,21 * * *'
    - cron: '27 15,17,19,21,23 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab too
  repository_dispatch: {}

permissions:
  contents: write  # needed so the workflow can commit updated known_dates.json back to the repo

jobs:
  check-availability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run availability check
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }}
          STATE_FILE: known_dates.json
          MONTHS_AHEAD: '3'
        run: |
          python check_appointments_all.py
          python check_appointments_jamie.py

      - name: Commit updated state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add known_dates.json
          git diff --cached --quiet || git commit -m "Update known appointment dates [skip ci]"
          git push
