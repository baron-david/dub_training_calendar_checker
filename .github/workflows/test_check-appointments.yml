name: TEST Check DubTraining Appointment Availability

on:
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab too


permissions:
  contents: write  # needed so the workflow can commit updated known_dates.json back to the repo

jobs:
  check-availability:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run availability check
        env:
          ## NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL_DEVELOPMENT }}
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID_DEVELOPMENT }}
          STATE_FILE: known_dates_test.json
          MONTHS_AHEAD: '2'
          COACH_NAME: 'Test Run'
          APPOINTMENT_TYPE_ID: '84360481'
          CALENDAR_ID: 'any'
          BOOKING_URL: 'https://dubtraining.as.me/schedule/ad1bb86c/appointment/84360440'

        run: |
          python check_appointments_w_times.py

      - name: Print state file
        run: |
          echo "Printing known dates file..."
          cat known_dates_test.json
