name: Cron Curl for appointment checker

on:
  schedule:
    - cron: '18 * * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  run-curl:
    runs-on: ubuntu-latest
    steps:
      - name: Run curl command
        env:
          MY_BEARER: ${{ secrets.MY_BEARER }}
        run: |
          curl -X POST -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $MY_BEARER" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/baron-david/dub_training_calendar_checker/dispatches \
            -d '{"event_type":"github-action-curl","client_payload":{"ref":"main","triggered_by":"curl"}}'